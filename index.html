<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>はじめてのVR</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- 全体を照らす弱い光 -->
      <a-light type="ambient" color="#6680AA" intensity="0.3"></a-light>
      <!-- 月明かりをイメージした光 -->
        <a-light type="directional" color="#AABBDD" intensity="0.5" position="-5 10 3"></a-light>
      <!-- 木を生成する場所 -->
      <a-entity id="forest"></a-entity>
      <!-- 雑草を生成する場所 -->
      <a-entity id="grasses"></a-entity>
      <!-- 花を生成する場所 -->
      <a-entity id="flowers"></a-entity>
      <!-- 惑星を配置する場所 -->
      <a-entity id="planets"></a-entity>
      <!-- 石 -->
      <a-sphere position="2 0.4 -6" radius="0.7" scale="1.4 0.7 1" color="#858585"></a-sphere>
      <!-- 池 -->
      <a-circle position="0 0.03 -10" rotation="-90 0 0" radius="4" color="#55BCEB"></a-circle>
      <!-- 地面 -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#78B66A"></a-plane>
      <!-- 空 -->
      <a-sky src="images/NightSkyHDRI015_2K_TONEMAPPED.jpg"></a-sky>
    </a-scene>

    <script src="script.js"></script>

  </body>
</html>
